name: Build Windows VST3

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target RESYNTHESIS_VST3
      - name: Package plugin
        shell: pwsh
        run: |
          $plugin = "build/RESYNTHESIS_artefacts/Release/VST3/RESYNTHESIS.vst3"
          if (!(Test-Path $plugin)) {
            Get-ChildItem build -Recurse -Filter "*.vst3" | Format-List FullName
            throw "VST3 bundle was not produced."
          }
          Compress-Archive -Path $plugin -DestinationPath RESYNTHESIS-Windows-VST3.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: RESYNTHESIS-Windows-VST3
          path: RESYNTHESIS-Windows-VST3.zip
          if-no-files-found: error
